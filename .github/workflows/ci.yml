name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: '!ChangeMe!'
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:!ChangeMe!@127.0.0.1:5432/app?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_pgsql, bcmath
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: php bin/console cache:warmup && vendor/bin/phpstan analyse --no-progress
      - run: php bin/console --env=test doctrine:database:create --if-not-exists && php bin/console --env=test doctrine:migrations:migrate --no-interaction
      - run: vendor/bin/phpunit
